name: Build Binder Daemon (NDK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - android_abi: arm64-v8a
          - android_abi: armeabi-v7a
          - android_abi: x86_64
          - android_abi: x86

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'

      - name: Verify AIDL files exist
        run: |
          echo "Listing AIDL files:"
          ls -R aidl

      - name: Generate AIDL NDK sources
        run: |
          mkdir -p gen
          # 列出要处理的文件
          AIDL_FILES="aidl/com/nexusroot/manager/INexusRootService.aidl aidl/com/nexusroot/manager/INexusRootCallback.aidl aidl/com/nexusroot/manager/WhitelistItem.aidl"
          echo "Processing: $AIDL_FILES"
          $ANDROID_SDK_ROOT/build-tools/34.0.0/aidl --lang=ndk -I aidl -o gen -h gen $AIDL_FILES
          echo "AIDL generation exit code: $?"
          echo "Generated files:"
          find gen -type f

      - name: Verify AIDL output
        run: |
          if [ ! -f "/src/INexusRootService.h" ]; then
            echo "ERROR: Missing INexusRootService.h"
            exit 1
          fi
          echo "AIDL headers OK."

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false
          local-cache: true

      - name: Build with CMake
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.android_abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --target nexusrootd -- -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusrootd-${{ matrix.android_abi }}
          path: build/nexusrootd
