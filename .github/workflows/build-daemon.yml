name: Build Binder Daemon

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - android_abi: arm64-v8a
          - android_abi: armeabi-v7a
          - android_abi: x86_64
          - android_abi: x86

    steps:
      - uses: actions/checkout@v4

      - name: Cache AIDL generated sources
        id: cache-aidl
        uses: actions/cache@v4
        with:
          path: gen
          key: aidl-${{ hashFiles('aidl/**') }}

      - name: Setup Android SDK
        if: steps.cache-aidl.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'

      - name: Generate AIDL C++ sources
        if: steps.cache-aidl.outputs.cache-hit != 'true'
        run: |
          mkdir -p gen/com/nexusroot/manager
          for f in aidl/com/nexusroot/manager/*.aidl; do
            $ANDROID_SDK_ROOT/build-tools/34.0.0/aidl --lang=cpp -I aidl -o gen $f
          done

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false
          local-cache: true

      - name: Build with CMake
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.android_abi }} \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INCLUDE_PATH=${GITHUB_WORKSPACE}/gen
          cmake --build . --target nexusrootd -- -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexusrootd-${{ matrix.android_abi }}
          path: build/nexusrootd
